<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心潮 · get_intent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1e1e2a;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header .sub {
      font-size: 0.8rem;
      color: #6b7280;
      font-weight: 400;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.3rem;
    }

    .status-dot.online { background: #10b981; }
    .status-dot.offline { background: #ef4444; }
    .status-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .refresh-btn {
      background: #1e1e2a;
      border: 1px solid #2e2e3a;
      color: #c0c0c8;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .refresh-btn:hover {
      background: #2e2e3a;
      border-color: #7c3aed;
      color: #fff;
    }

    .refresh-btn:active {
      transform: scale(0.96);
    }

    .last-update {
      text-align: right;
      font-size: 0.75rem;
      color: #4b5563;
      margin-top: 0.3rem;
    }

    .card {
      background: #12121a;
      border: 1px solid #1e1e2a;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }

    .intent-display {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .intent-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1e1e2a;
      border: 1px solid #2e2e3a;
      border-radius: 20px;
      padding: 0.4rem 0.8rem 0.4rem 0.6rem;
      font-size: 0.85rem;
    }

    .intent-badge .emoji { font-size: 1.1rem; }
    .intent-badge .key { color: #a78bfa; font-weight: 500; }
    .intent-badge .value { color: #6b7280; font-size: 0.75rem; }
    .intent-label { font-size: 1.1rem; font-weight: 500; color: #e0e0e8; }

    .drive-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .drive-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .drive-label {
      width: 100px;
      font-size: 0.85rem;
      color: #9ca3af;
      flex-shrink: 0;
    }

    .drive-bar-track {
      flex: 1;
      height: 8px;
      background: #1e1e2a;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .drive-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
      position: relative;
    }

    .drive-bar-fill::after {
      content: attr(data-pct);
      position: absolute;
      right: -2.5rem;
      top: -4px;
      font-size: 0.75rem;
      color: #6b7280;
    }

    .drive-value {
      width: 2.5rem;
      text-align: right;
      font-size: 0.8rem;
      font-weight: 500;
      color: #d0d0d8;
      flex-shrink: 0;
    }

    .thought-pool { display: flex; flex-direction: column; gap: 0.5rem; }

    .thought-item {
      background: #1a1a24;
      border: 1px solid #2a2a34;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #c0c0c8;
    }

    .thought-item .thought-key {
      color: #a78bfa;
      font-weight: 500;
      font-size: 0.75rem;
      margin-bottom: 0.2rem;
    }

    .thought-item .thought-intensity {
      display: inline-block;
      font-size: 0.7rem;
      color: #6b7280;
      margin-left: 0.4rem;
    }

    .empty-state { color: #4b5563; font-size: 0.85rem; font-style: italic; }

    .fatigue-display {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .fatigue-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: conic-gradient(
        #7c3aed 0deg,
        #a855f7 var(--fatigue-deg, 0deg),
        #1e1e2a var(--fatigue-deg, 0deg)
      );
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .fatigue-ring-inner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #12121a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e0e8;
    }

    .fatigue-text { font-size: 0.85rem; color: #9ca3af; }
    .fatigue-text .val { color: #e0e0e8; font-weight: 500; }

    .satisfied-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .satisfied-tag {
      background: #1a1a24;
      border: 1px solid #2a2a34;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
      color: #a78bfa;
    }

    .loading {
      text-align: center;
      padding: 3rem 0;
      color: #4b5563;
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid #1e1e2a;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 2rem;
      color: #f87171;
    }

    .error .err-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .error .err-msg { font-size: 0.85rem; color: #9ca3af; margin-top: 0.3rem; }

    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .refresh-btn { align-self: flex-end; }
      .drive-label { width: 80px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <div class="header-left">
        <div class="logo">♡</div>
        <div>
          <h1>心潮 <span class="sub">· get_intent</span></h1>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <span id="statusBadge" style="font-size:0.75rem;color:#6b7280;">
          <span class="status-dot connecting" id="statusDot"></span>
          <span id="statusText">连接中</span>
        </span>
        <button class="refresh-btn" onclick="reconnect()">
          <span class="icon">↻</span> 重连
        </button>
      </div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>等待心潮数据…</div>
      </div>
    </div>

    <div class="last-update" id="lastUpdate"></div>
  </div>

  <script>
    const DRIVE_COLORS = {
      'monitor': '#7c3aed', 'possess': '#a855f7', 'crave': '#ec4899',
      'share': '#f59e0b', 'curiosity': '#10b981', 'social': '#3b82f6', 'intimacy': '#ef4444',
    };

    const DRIVE_EMOJIS = {
      'monitor': '👀', 'possess': '🤲', 'crave': '💜',
      'share': '📣', 'curiosity': '🔍', 'social': '👥', 'intimacy': '🔥',
    };

    const INTENT_EMOJIS = {
      'crave': '💜', 'possess': '🤲', 'monitor': '👀',
      'share': '📣', 'curiosity': '🔍',
    };

    function getColor(k) { return DRIVE_COLORS[k] || '#7c3aed'; }
    function getEmoji(k) { return DRIVE_EMOJIS[k] || '♡'; }
    function getIntentEmoji(k) { return INTENT_EMOJIS[k] || '♡'; }
    function pct(v) { return Math.round(v * 100); }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function setStatus(state, text) {
      const dot = document.getElementById('statusDot');
      const label = document.getElementById('statusText');
      dot.className = 'status-dot ' + state;
      label.textContent = text;
    }

    function render(data) {
      const content = document.getElementById('content');

      if (!data || data.error) {
        content.innerHTML = `
          <div class="error">
            <div class="err-icon">💔</div>
            <div>心潮读取失败</div>
            <div class="err-msg">${data?.error || '未知错误'}</div>
          </div>
        `;
        return;
      }

      const intent = data.intent || {};
      const drives = data.topDrives || [];
      const thoughtPool = data.thoughtPool || {};
      const flash = thoughtPool.flash || [];
      const obsessions = thoughtPool.obsessions || [];
      const fatigue = data.fatigue ?? -1;
      const satisfied = data.satisfiedDrives || [];
      const fatigueDeg = fatigue >= 0 ? fatigue * 360 : 0;

      let html = '';

      html += `
        <div class="card">
          <div class="card-title">当前意图</div>
          <div class="intent-display">
            <div class="intent-badge">
              <span class="emoji">${getIntentEmoji(intent.key)}</span>
              <span class="key">${intent.key || '—'}</span>
              <span class="value">${intent.value != null ? pct(intent.value) + '%' : ''}</span>
            </div>
            <div class="intent-label">${intent.label || '等待中…'}</div>
          </div>
        </div>
      `;

      if (drives.length > 0) {
        html += `<div class="card"><div class="card-title">驱动力</div><div class="drive-list">`;
        drives.forEach(d => {
          const v = pct(d.value);
          html += `
            <div class="drive-item">
              <div class="drive-label">${getEmoji(d.key)} ${d.label}</div>
              <div class="drive-bar-track">
                <div class="drive-bar-fill" style="width:${v}%;background:${getColor(d.key)}" data-pct="${v}%"></div>
              </div>
              <div class="drive-value">${v}%</div>
            </div>
          `;
        });
        html += `</div></div>`;
      }

      const hasThoughts = flash.length > 0 || obsessions.length > 0;
      html += `<div class="card"><div class="card-title">思绪池</div><div class="thought-pool">`;

      flash.forEach(t => {
        html += `
          <div class="thought-item">
            <div class="thought-key">✦ 闪念${t.intensity != null ? `<span class="thought-intensity">强度 ${t.intensity}</span>` : ''}</div>
            <div>${t.text || t.key || '…'}</div>
          </div>
        `;
      });

      obsessions.forEach(t => {
        html += `
          <div class="thought-item">
            <div class="thought-key">⟳ 执念${t.intensity != null ? `<span class="thought-intensity">强度 ${t.intensity}</span>` : ''}</div>
            <div>${t.text || t.key || '…'}</div>
          </div>
        `;
      });

      if (!hasThoughts) html += `<div class="empty-state">此刻心潮平静，没有闪念或执念</div>`;
      html += `</div></div>`;

      if (fatigue >= 0) {
        html += `
          <div class="card">
            <div class="card-title">疲劳值</div>
            <div class="fatigue-display">
              <div class="fatigue-ring" style="--fatigue-deg:${fatigueDeg}deg">
                <div class="fatigue-ring-inner">${pct(fatigue)}%</div>
              </div>
              <div class="fatigue-text">
                ${fatigue < 0.3 ? '✨ 精力充沛' : fatigue < 0.6 ? '🌙 略有倦意' : fatigue < 0.8 ? '☕ 需要休息' : '💤 非常疲惫'}
                <div style="font-size:0.75rem;color:#4b5563;margin-top:0.2rem;">数值: <span class="val">${fatigue.toFixed(2)}</span></div>
              </div>
            </div>
          </div>
        `;
      }

      if (satisfied.length > 0) {
        html += `<div class="card"><div class="card-title">已满足的驱动力</div><div class="satisfied-tags">`;
        satisfied.forEach(s => { html += `<span class="satisfied-tag">${getEmoji(s)} ${s}</span>`; });
        html += `</div></div>`;
      }

      content.innerHTML = html;
      document.getElementById('lastUpdate').textContent = `最后更新: ${formatTime(data.timestamp)}`;
    }

    let eventSource = null;

    function connectSSE() {
      if (eventSource) {
        eventSource.close();
      }

      setStatus('connecting', '连接中');

      eventSource = new EventSource('/api/stream');

      eventSource.onopen = () => {
        setStatus('online', '实时');
      };

      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          render(data);
          setStatus('online', '实时');
        } catch (err) {
          console.error('解析失败:', err);
        }
      };

      eventSource.onerror = () => {
        setStatus('offline', '离线');
        // 3秒后自动重连
        setTimeout(() => {
          if (eventSource.readyState === EventSource.CLOSED) {
            connectSSE();
          }
        }, 3000);
      };
    }

    function reconnect() {
      connectSSE();
    }

    // 启动 SSE 连接
    connectSSE();
  </script>
</body>
</html>
