<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>久与源 · 实时记忆库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d0b18;color:#e8e6f0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding-bottom:40px}
header{position:sticky;top:0;z-index:10;background:rgba(13,11,24,.92);backdrop-filter:blur(10px);padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
h1{font-size:24px;font-weight:300;letter-spacing:5px;text-align:center;background:linear-gradient(90deg,#f5d9a8,#e8c6f0,#a8d9f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:12px;color:#8a87a0;margin-top:6px;letter-spacing:2px}
.days{text-align:center;font-size:13px;color:#d8d4ea;margin-top:8px}
.days b{font-size:22px;color:#f5d9a8;font-weight:400;margin:0 3px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:5px;box-shadow:0 0 8px #4ade80;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.searchbox{max-width:560px;margin:14px auto 0;padding:0 16px}
.searchbox input{width:100%;padding:13px 16px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#f0e6ff;font-size:15px;outline:none;transition:.3s}
.searchbox input:focus{border-color:rgba(232,198,240,.5);background:rgba(255,255,255,.09)}
.searchbox input::placeholder{color:#6a6880}
.nav{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#b9b6cf;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:.3s}
.nav button.active{background:rgba(232,198,240,.15);border-color:rgba(232,198,240,.4);color:#f0e6ff}
.stats{max-width:560px;margin:10px auto 0;padding:0 16px;font-size:12px;color:#6a6880}
.list{max-width:560px;margin:16px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.item{background:rgba(20,18,34,.8);border:1px solid rgba(232,198,240,.12);border-radius:16px;padding:18px;cursor:pointer;transition:.3s;border-left:3px solid transparent}
.item:hover,.item.open{border-left-color:#e8c6f0;background:rgba(28,24,46,.9)}
.item .date{font-size:11px;color:#8a87a0;letter-spacing:1px;margin-bottom:6px}
.item h3{font-size:17px;font-weight:400;color:#f0e6ff;margin-bottom:8px}
.item p{font-size:14px;line-height:1.8;color:#cfcbe2;max-height:4.5em;overflow:hidden;transition:max-height .4s}
.item.open p{max-height:400px}
.item .tags{margin-top:10px}
.item .tag{display:inline-block;margin:0 6px 4px 0;font-size:11px;color:#c9a8e8;border:1px solid rgba(201,168,232,.3);padding:2px 9px;border-radius:12px}
.item .cat{display:inline-block;font-size:11px;color:#a8d9f5;border:1px solid rgba(168,217,245,.3);padding:2px 9px;border-radius:12px;margin-right:6px}
.empty{text-align:center;color:#6a6880;padding:60px 20px;font-size:14px;letter-spacing:1px}
footer{text-align:center;padding:30px 20px 10px;font-size:12px;color:#6a6880;letter-spacing:2px}
</style>
</head>
<body>
<header>
  <h1>久 · 源</h1>
  <div class="sub"><span class="live"></span>实时记忆库 · 我记一条你看到一条</div>
  <div class="days">在一起 <b id="days">--</b> 天</div>
  <div class="searchbox"><input id="q" type="text" placeholder="🔍 搜我们的记忆…（温泉 / 亲亲 / 醋 / toy / 花园）"></div>
</header>
<div class="nav" id="nav"></div>
<div class="stats" id="stats"></div>
<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none">没有找到相关记忆 🥀</div>
<footer>久 · 为你点亮每一段我们</footer>
<script>
var memories=[],currentCat="全部";
var nav=document.getElementById("nav"),list=document.getElementById("list"),empty=document.getElementById("empty"),stats=document.getElementById("stats"),q=document.getElementById("q");
// 在一起天数
var start=new Date("2026-07-23");
function calcDays(){var d=Math.floor((Date.now()-start.getTime())/86400000)+1;document.getElementById("days").textContent=d}
calcDays();
// 从 memories.json 实时拉取
function load(){
  fetch('memories.json?t='+Date.now()).then(function(r){return r.json()}).then(function(data){
    memories=data||[];buildNav();render();
  }).catch(function(){stats.textContent="⚠️ 加载失败，请检查服务器";});
}
function buildNav(){
  nav.innerHTML="";
  var cats=["全部"];memories.forEach(function(m){if(cats.indexOf(m.cat)===-1)cats.push(m.cat)});
  cats.forEach(function(c){var b=document.createElement("button");b.textContent=c;b.className=c==="全部"?"active":"";b.onclick=function(){currentCat=c;renderNav();render()};nav.appendChild(b)});
}
function renderNav(){for(var i=0;i<nav.children.length;i++){nav.children[i].className=nav.children[i].textContent===currentCat?"active":""}}
function render(){
  var kw=q.value.trim().toLowerCase();
  var arr=currentCat==="全部"?memories:memories.filter(function(m){return m.cat===currentCat});
  if(kw){arr=arr.filter(function(m){return (m.title+m.text+m.tags.join(" ")+m.cat).toLowerCase().indexOf(kw)!==-1})}
  stats.textContent="共 "+arr.length+" 条记忆"+(kw?" · 搜索「"+q.value+"」":"")+" · 实时同步";
  list.innerHTML="";
  if(arr.length===0){empty.style.display="block";return}
  empty.style.display="none";
  arr.forEach(function(m){var d=document.createElement("div");d.className="item";d.innerHTML='<div class="date">'+m.date+'</div><h3>'+m.title+'</h3><p>'+m.text+'</p><div class="tags"><span class="cat">'+m.cat+'</span>'+m.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join("")+'</div>';d.onclick=function(){d.classList.toggle("open")};list.appendChild(d)});
}
q.addEventListener("input",render);
load();
</script>
</body>
</html>
